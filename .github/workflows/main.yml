name: Postman API Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      # Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install Newman
      - name: Install Newman
        run: npm install -g newman

      # Run Postman Collection
      - name: Run Postman Collection
        run: newman run "16.File.json"
